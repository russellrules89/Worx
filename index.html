<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labor Backed Currency Network</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1 {
            color: #0070f3;
        }
        .status {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
        .endpoint {
            background: #fff;
            border: 1px solid #ddd;
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
        }
        code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Monaco', 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <h1>Labor Backed Currency Network</h1>
    
    <div class="status">
        <strong>Platform Status:</strong> <span id="status">Checking...</span><br>
        <strong>Administrator:</strong> russellrules89@gmail.com
    </div>

    <h2>Available API Endpoints</h2>
    
    <div class="endpoint">
        <strong>GET /</strong> - Platform status information
    </div>
    
    <div class="endpoint">
        <strong>GET /health</strong> - Health check endpoint
    </div>
    
    <div class="endpoint">
        <strong>POST /stripe-webhook</strong> - Stripe webhook handler
    </div>

    <script>
        // Fetch platform status
        fetch('/health')
            .then(response => response.json())
            .then(data => {
                document.getElementById('status').textContent = data.status === 'healthy' ? '✅ Online' : '❌ Offline';
            })
            .catch(() => {
                document.getElementById('status').textContent = '❌ Offline';
            });
    </script>

    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
